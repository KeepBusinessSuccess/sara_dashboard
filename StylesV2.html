<style>
  /* SARA v2: legibilidad para proyectores y salas de juntas */
  body{font-size:16px}
  .nav-item{font-size:14px;padding:12px 11px}.nav-label{font-size:11px}.brand small{font-size:11px}
  .page-heading p,.section-kicker{font-size:11px}.page-heading h1{font-size:23px}
  .last-update span{font-size:10px}.last-update strong{font-size:12px}
  .profile-copy strong{font-size:13px}.profile-copy small{font-size:11px}
  .welcome-row h2,.section-header h2{font-size:30px}.section-description{font-size:14px;line-height:1.55}
  .kpi-label{font-size:13px}.card-value{font-size:29px}.kpi-meta{font-size:11px}
  .panel-heading h3{font-size:17px}.legend,.text-button{font-size:11px}
  .alert-copy strong{font-size:13px}.alert-copy small,.alert-days{font-size:11px}
  .funnel-row span,.funnel-row strong,.project-row header,.project-row header strong{font-size:12px}
  .table-toolbar input,th,td{font-size:12px}th{font-size:10px}.table-toolbar span{font-size:11px}
  .role-pill,.priority-pill,.edit-role,.status-pill,.access-chip{font-size:10px}
  .module-stat span{font-size:11px}.module-empty p{font-size:13px}.sidebar-footer small,.system-status{font-size:11px}
  .nav-icon{font-size:9px;font-weight:800;letter-spacing:-.02em;width:30px}.nav-item{grid-template-columns:34px 1fr auto}
  .theme-button{width:auto;min-width:112px;padding:0 12px;font-size:10px;font-weight:800;letter-spacing:.07em}
  .header-actions{display:flex;align-items:center;gap:8px}.hierarchy-actions{display:flex;align-items:center;gap:10px}
  .permission-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
  .permission-option{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12px}
  .permission-option input{width:17px;height:17px;accent-color:var(--accent)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-field{display:grid;gap:6px}.form-field.full{grid-column:1/-1}
  .modal.access-modal{width:min(720px,100%);max-height:90vh;overflow:auto}.modal input,.modal select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .protected-note{padding:12px;border:1px solid rgba(255,212,0,.3);background:rgba(255,212,0,.08);border-radius:10px;color:var(--text);font-size:12px}
  .auth-screen{position:fixed;inset:0;z-index:210;display:grid;place-items:center;background:var(--bg);padding:24px}.auth-screen[hidden]{display:none}
  .auth-card{width:min(470px,100%);padding:38px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
  .auth-card h1{font-size:28px;margin:22px 0 10px}.auth-card p{font-size:14px;line-height:1.65;color:var(--muted)}.auth-card .button{margin-top:14px;width:100%;padding:13px}
  .auth-domain{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .superadmin-pill{display:inline-flex;padding:6px 9px;border:1px solid rgba(255,212,0,.35);border-radius:9px;background:rgba(255,212,0,.1);color:var(--accent);font-weight:800;font-size:10px}

  html[data-theme="light"]{color-scheme:light;--bg:#f2f0e8;--surface:#ffffff;--surface-2:#f7f5ef;--surface-3:#ece9df;--line:#d3cfc2;--line-soft:#e3dfd4;--text:#17191d;--muted:#5e6670;--shadow:0 18px 48px rgba(40,35,20,.13)}
  html[data-theme="light"] body,html[data-theme="light"] .app-shell{background:radial-gradient(circle at 70% -15%,rgba(230,177,0,.12),transparent 30%),var(--bg);color:var(--text)}
  html[data-theme="light"] .sidebar{background:linear-gradient(180deg,#ffffff,#f3f1e9);border-color:var(--line)}
  html[data-theme="light"] .topbar{background:rgba(247,245,238,.92);border-color:var(--line)}
  html[data-theme="light"] .panel,html[data-theme="light"] .kpi-card{background:linear-gradient(145deg,#ffffff,#f8f6f0);border-color:var(--line)}
  html[data-theme="light"] .icon-button,html[data-theme="light"] .profile-button,html[data-theme="light"] .table-toolbar input,html[data-theme="light"] .modal,html[data-theme="light"] .modal input,html[data-theme="light"] .modal select{background:#fff;color:var(--text);border-color:var(--line)}
  html[data-theme="light"] th{background:#ebe8df;color:#4d5661}html[data-theme="light"] tbody tr:hover{background:#f1efe8}
  html[data-theme="light"] .nav-item{color:#505965}html[data-theme="light"] .nav-item:hover{background:#ebe8df;color:#111}html[data-theme="light"] .nav-item.active{background:linear-gradient(90deg,rgba(218,169,0,.2),rgba(218,169,0,.06));color:#111}
  html[data-theme="light"] .nav-icon,html[data-theme="light"] .edit-role,html[data-theme="light"] .role-pill{background:#f5f2e9;border-color:#d8d3c6;color:#343a43}
  html[data-theme="light"] .card-value,html[data-theme="light"] .panel-heading h3,html[data-theme="light"] .welcome-row h2,html[data-theme="light"] .section-header h2{color:#111}
  html[data-theme="light"] .grid-line{stroke:#d9d5ca}html[data-theme="light"] .target-line{stroke:#808895}html[data-theme="light"] .chart-label{fill:#59616c}
  html[data-theme="light"] .funnel-track,html[data-theme="light"] .progress-track{background:#ddd9ce}
  html[data-theme="light"] .loading-screen{background:var(--bg);color:var(--text)}
  html[data-theme="light"] .permission-option{background:#f8f6f0}
  @media(max-width:820px){.theme-button{min-width:68px}.theme-button span{display:none}.form-grid{grid-template-columns:1fr}.permission-grid{grid-template-columns:1fr}}
</style>
