<script>
const SARA_APP=(()=>{
  const moduleMeta={
    crm:{title:'CRM',kicker:'GESTIÓN COMERCIAL',description:'Leads por departamento, fuente, estatus y monto.',symbol:'CRM',stats:[['Leads activos','128'],['Conversión','24.8%'],['Pipeline','$4.8 M'],['Ganados','31']]},
    billing:{title:'Facturación',kicker:'CONTROL FINANCIERO',description:'Facturación, IVA, montos por cobrar y vencidos.',symbol:'FAC',stats:[['Facturado','$2.48 M'],['Por cobrar','$684 k'],['Vencido','$142 k'],['IVA','$396 k']]},
    training:{title:'Capacitación',kicker:'UNIDAD OPERATIVA',description:'Cursos, horas instructor, suscripciones y calificaciones.',symbol:'CAP',stats:[['Cursos activos','18'],['Horas instructor','486'],['Calificación','9.3'],['Suscripciones','$38 k']]},
    contingency:{title:'Contingencia',kicker:'UNIDAD OPERATIVA',description:'Estatus, avance y control económico de proyectos.',symbol:'CON',stats:[['Proyectos activos','14'],['Avance promedio','73%'],['En riesgo','2'],['Margen','28%']]},
    safety:{title:'Seguridad y normas',kicker:'CUMPLIMIENTO',description:'Normativa, flotilla, accidentes y retorno de seguridad.',symbol:'SN',stats:[['Cumplimiento','94%'],['Mantenimientos','8'],['Accidentes','0'],['ROI seguridad','1.8x']]},
    hr:{title:'Recursos humanos',kicker:'ADMINISTRACIÓN',description:'Plantilla, asistencia, retención, vacantes e incidencias.',symbol:'RH',stats:[['Plantilla','184'],['Retención 90d','96%'],['Vacantes','7'],['Incidencias','12']]},
    commercial:{title:'Comercial y marketing',kicker:'CRECIMIENTO',description:'Conversión, pauta, visitas y desempeño por vendedor.',symbol:'CM',stats:[['Leads','384'],['Conversión','24.8%'],['Gasto pauta','$92 k'],['Visitas','147']]},
    evaluations:{title:'Evaluaciones N4',kicker:'LIDERAZGO',description:'Sostenibilidad y crecimiento con ventana móvil de 12 meses.',symbol:'EV',stats:[['Evaluados','8'],['Promedio','88.4'],['Crecimiento','+7.2%'],['Sostenibilidad','91%']]}
  };
  const demoData={
    user:{name:'Innovación KBS',email:'innovacion@kbsbusiness.com',role:'SUPER ADMIN',level:5,department:'Innovación'},
    permissions:{canManageAccess:true,views:['overview','alerts','crm','billing','training','contingency','safety','hr','commercial','evaluations','hierarchies']},
    dashboard:{
      metrics:[
        {id:'revenue',label:'Facturación',value:2484000,display:'money',icon:'$',trend:'+12.4%',meta:'vs. mes anterior',color:'#ffd400',warning:2000000,danger:1400000},
        {id:'courses',label:'Cursos activos',value:18,icon:'CUR',trend:'+3',meta:'este trimestre',color:'#3edbd7',warning:12,danger:6},
        {id:'projects',label:'Proyectos activos',value:14,icon:'PRO',trend:'73%',meta:'avance promedio',color:'#44d39a',warning:10,danger:4},
        {id:'overdue',label:'Facturas vencidas',value:7,icon:'!',trend:'$142 k',meta:'monto pendiente',color:'#ff5f68',warning:9,danger:3,invert:true},
        {id:'leads',label:'Leads',value:128,icon:'LEA',trend:'+18.2%',meta:'pipeline activo',color:'#b98cff',warning:100,danger:55}
      ],
      trend:{labels:['Abr','May','Jun','Jul','Ago','Sep'],actual:[1.18,1.42,1.37,1.86,2.12,2.48],target:[1.3,1.4,1.55,1.7,1.9,2.1],total:2484000,delta:18.3},
      crm:[{label:'Nuevos',value:128},{label:'Contactados',value:96},{label:'Cotizados',value:62},{label:'Ganados',value:31}],
      projects:[{name:'Planta Norte · NFPA',progress:86},{name:'Contingencia Bajío',progress:74},{name:'Certificación NOM',progress:61}]
    },
    alerts:[
      {id:'A-104',title:'Renovación DC-3 · Planta Norte',area:'Capacitación',owner:'Laura Méndez',dueDate:'08 sep 2026',days:7,status:'critical'},
      {id:'A-098',title:'Mantenimiento unidad F-08',area:'Seguridad y Normas',owner:'Iván Ríos',dueDate:'14 sep 2026',days:13,status:'soon'},
      {id:'A-091',title:'Cobranza factura KBS-1842',area:'Facturación',owner:'Ana Torres',dueDate:'18 sep 2026',days:17,status:'soon'},
      {id:'A-076',title:'Renovación suscripción LMS',area:'Capacitación',owner:'Mario Soto',dueDate:'19 nov 2026',days:79,status:'valid'}
    ],
    hierarchies:[
      {id:'KBS-SA-001',name:'Innovación KBS',department:'Innovación',position:'Superadministrador SARA',status:'ACTIVO',role:'SUPER ADMIN',email:'innovacion@kbsbusiness.com',views:['overview','alerts','crm','billing','training','contingency','safety','hr','commercial','evaluations','hierarchies'],protected:true},
      {id:'KBS-001',name:'Alejandra Ríos',department:'Dirección',position:'Directora General',status:'ACTIVO',role:'DIRECCIÓN',email:'alejandra@kbsbusiness.com'},
      {id:'KBS-014',name:'Daniel Ortega',department:'Comercial',position:'Coordinador Comercial',status:'ACTIVO',role:'COORDINADOR',email:'daniel@kbsbusiness.com'},
      {id:'KBS-028',name:'Mariana Cruz',department:'Capacitación',position:'Líder de Capacitación',status:'ACTIVO',role:'LÍDER',email:'mariana@kbsbusiness.com'},
      {id:'KBS-036',name:'Luis Herrera',department:'Seguridad y Normas',position:'Especialista HSE',status:'ACTIVO',role:'TRABAJADOR',email:'luis@kbsbusiness.com'},
      {id:'KBS-047',name:'Carla Núñez',department:'Recursos Humanos',position:'Coordinadora RH',status:'ACTIVO',role:'COORDINADOR',email:'carla@kbsbusiness.com'},
      {id:'KBS-051',name:'Sergio Vidal',department:'Contingencia',position:'Líder de proyecto',status:'ACTIVO',role:'LÍDER',email:'sergio@kbsbusiness.com'}
    ],meta:{generatedAt:new Date().toISOString(),mode:'demo'}
  };
  const state={data:null,currentView:'overview',editingId:null};

  const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const initials=name=>String(name||'KBS').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
  function callServer(functionName,...args){return new Promise((resolve,reject)=>{if(window.SaraBridge&&!SaraBridge.isDemo()){SaraBridge.run(functionName,...args).then(resolve,reject);return}if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error&&error.message||'No fue posible conectar con el servidor.')))[functionName](...args);return}if(window.SaraBridge&&SaraBridge.isDemo()){setTimeout(()=>resolve(demoData),300);return}reject(new Error('La conexión con SARA no está configurada.'))})}
  function toast(message,type='success'){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=message;document.getElementById('toastStack').appendChild(el);setTimeout(()=>el.remove(),4200)}
  function formatMetric(metric){if(metric.display==='money')return Hyperion.formatMoney(metric.value,true);return Number(metric.value||0).toLocaleString('es-MX')}
  function renderKpis(metrics){const grid=document.getElementById('kpiGrid');grid.innerHTML=metrics.map(m=>`<article class="kpi-card" style="--card-color:${escapeHtml(m.color)}"><div class="kpi-top"><span class="kpi-label">${escapeHtml(m.label)}</span><span class="kpi-icon">${escapeHtml(m.icon)}</span></div><strong class="card-value" id="kpi-${escapeHtml(m.id)}">${formatMetric({...m,value:0})}</strong><div class="kpi-meta"><span class="kpi-trend">${escapeHtml(m.trend)}</span><span>${escapeHtml(m.meta)}</span></div></article>`).join('');metrics.forEach(m=>{const el=document.getElementById(`kpi-${m.id}`);Hyperion.animate(el,0,m.value,{money:m.display==='money',compact:m.display==='money'});Hyperion.glow(el,m.invert?-m.value:m.value,{warning:m.invert?-m.danger:m.warning,danger:m.invert?-m.warning:m.danger})})}
  function renderChart(trend){const width=640,height=210,pad={left:34,right:12,top:15,bottom:28};const values=[...trend.actual,...trend.target];const max=Math.max(...values,1)*1.15,min=0;const x=i=>pad.left+i*((width-pad.left-pad.right)/(trend.labels.length-1));const y=v=>pad.top+(max-v)/(max-min)*(height-pad.top-pad.bottom);const path=arr=>arr.map((v,i)=>`${i?'L':'M'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');const area=`${path(trend.actual)} L ${x(trend.actual.length-1)} ${height-pad.bottom} L ${x(0)} ${height-pad.bottom} Z`;document.getElementById('revenueChart').innerHTML=`<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd400" stop-opacity=".22"/><stop offset="1" stop-color="#ffd400" stop-opacity="0"/></linearGradient></defs>${[.25,.5,.75,1].map(p=>`<line class="grid-line" x1="${pad.left}" y1="${pad.top+(height-pad.top-pad.bottom)*p}" x2="${width-pad.right}" y2="${pad.top+(height-pad.top-pad.bottom)*p}"/>`).join('')}<path class="actual-area" d="${area}"/><path class="target-line" d="${path(trend.target)}"/><path class="actual-line" d="${path(trend.actual)}"/>${trend.actual.map((v,i)=>`<circle class="chart-dot" cx="${x(i)}" cy="${y(v)}" r="3"/>`).join('')}${trend.labels.map((label,i)=>`<text class="chart-label" x="${x(i)}" y="${height-7}" text-anchor="middle">${escapeHtml(label)}</text>`).join('')}</svg>`;document.getElementById('chartTotal').textContent=Hyperion.formatMoney(trend.total,true);const delta=document.getElementById('chartDelta');delta.textContent=`${trend.delta>=0?'+':''}${trend.delta}% sobre meta`;delta.style.color=trend.delta>=0?'var(--green)':'var(--red)'}
  function statusLabel(status){return status==='critical'?'Crítico':status==='soon'?'Próximo':'Vigente'}
  function renderAlerts(alerts){document.getElementById('alertBadge').textContent=alerts.filter(a=>a.status==='critical').length;document.getElementById('alertList').innerHTML=alerts.slice(0,4).map(a=>`<div class="alert-row" style="--row-color:var(--${a.status==='soon'?'orange':a.status==='valid'?'green':'red'})"><i></i><div class="alert-copy"><strong>${escapeHtml(a.title)}</strong><small>${escapeHtml(a.area)} · ${escapeHtml(a.owner)}</small></div><span class="alert-days">${Number(a.days)} días</span></div>`).join('');renderAlertsTable(alerts)}
  function renderAlertsTable(alerts){const query=(document.getElementById('alertSearch').value||'').toLowerCase();const rows=alerts.filter(a=>Object.values(a).join(' ').toLowerCase().includes(query));document.getElementById('alertCount').textContent=`${rows.length} registros`;document.getElementById('alertsTableBody').innerHTML=rows.map(a=>`<tr><td><span class="priority-pill ${a.status}">${statusLabel(a.status)}</span></td><td>${escapeHtml(a.title)}</td><td>${escapeHtml(a.area)}</td><td>${escapeHtml(a.owner)}</td><td>${escapeHtml(a.dueDate)}</td><td>${Number(a.days)}</td></tr>`).join('')||'<tr><td colspan="6">Sin resultados.</td></tr>'}
  function renderFunnel(rows){const max=Math.max(...rows.map(x=>x.value),1);document.getElementById('crmFunnel').innerHTML=rows.map(row=>`<div class="funnel-row"><span>${escapeHtml(row.label)}</span><div class="funnel-track"><div class="funnel-fill" style="width:${row.value/max*100}%"></div></div><strong>${row.value}</strong></div>`).join('')}
  function renderProjects(rows){document.getElementById('projectProgress').innerHTML=rows.map(row=>`<div class="project-row"><header><span>${escapeHtml(row.name)}</span><strong>${Number(row.progress)}%</strong></header><div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,row.progress))}%"></div></div></div>`).join('')}
  function renderHierarchies(){const query=(document.getElementById('hierarchySearch').value||'').toLowerCase();const rows=(state.data.hierarchies||[]).filter(row=>Object.values(row).join(' ').toLowerCase().includes(query));const canManage=Boolean(state.data.permissions.canManageAccess);document.getElementById('hierarchyAccess').textContent=canManage?'SUPERADMIN EXCLUSIVO':'SIN PERMISO';document.getElementById('hierarchyCount').textContent=`${rows.length} personas`;document.getElementById('hierarchyTableBody').innerHTML=rows.map(row=>`<tr><td>${escapeHtml(row.id)}</td><td><div class="person-cell"><span class="mini-avatar">${initials(row.name)}</span><strong>${escapeHtml(row.name)}</strong></div></td><td>${escapeHtml(row.department)}</td><td>${escapeHtml(row.position)}</td><td><span class="status-dot">${escapeHtml(row.status)}</span></td><td><span class="role-pill ${row.role==='SUPER ADMIN'||row.role==='DIRECCIÓN'?'direction':''}">${escapeHtml(row.role)}</span></td><td>${escapeHtml(row.email)}</td><td>${row.protected?'<span class="superadmin-pill">PROTEGIDO</span>':canManage?`<button class="edit-role" data-edit-access="${escapeHtml(row.id)}">CONFIGURAR</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8">Sin resultados.</td></tr>';Hyperion.smartHover('#hierarchyTable')}
  const permissionLabels={overview:'Dashboard general',alerts:'Centro de alertas',crm:'CRM',billing:'Facturación',training:'Capacitación',contingency:'Contingencia',safety:'Seguridad y normas',hr:'Recursos humanos',commercial:'Comercial y marketing',evaluations:'Evaluaciones N4'};
  const defaultViews={TRABAJADOR:['overview','alerts','training','contingency','safety'],'LÍDER':['overview','alerts','training','contingency','safety','crm','billing','commercial'],COORDINADOR:['overview','alerts','training','contingency','safety','crm','billing','commercial','hr'],'DIRECCIÓN':['overview','alerts','training','contingency','safety','crm','billing','commercial','hr','evaluations']};
  function applyTheme(theme){const selected=theme||localStorage.getItem('sara-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=selected;localStorage.setItem('sara-theme',selected);const button=document.getElementById('themeButton');if(button)button.innerHTML=selected==='dark'?'<span>MODO</span> CLARO':'<span>MODO</span> OSCURO'}
  function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
  function renderPermissionOptions(selected){const allowed=new Set(selected||[]);document.getElementById('permissionGrid').innerHTML=Object.entries(permissionLabels).map(([view,label])=>`<label class="permission-option"><input type="checkbox" name="permission" value="${view}" ${allowed.has(view)?'checked':''}><span>${escapeHtml(label)}</span></label>`).join('')}
  function openAccessModal(id){if(!state.data.permissions.canManageAccess)return;const row=id?(state.data.hierarchies||[]).find(item=>String(item.id)===String(id)):null;if(row&&row.protected){toast('La cuenta del superadministrador está protegida.','error');return}state.editingId=row?row.id:null;document.getElementById('accessModalTitle').textContent=row?'Configurar persona':'Nueva persona';document.getElementById('personId').value=row?row.id:'';document.getElementById('personName').value=row?row.name:'';document.getElementById('personEmail').value=row?row.email:'';document.getElementById('personDepartment').value=row?row.department:'';document.getElementById('personPosition').value=row?row.position:'';document.getElementById('personStatus').value=row?row.status:'ACTIVO';document.getElementById('personRole').value=row?row.role:'TRABAJADOR';renderPermissionOptions(row&&row.views?row.views:defaultViews[row?row.role:'TRABAJADOR']);document.getElementById('accessModal').hidden=false}
  function closeAccessModal(){document.getElementById('accessModal').hidden=true;state.editingId=null}
  async function saveAccess(event){event.preventDefault();const submit=event.target.querySelector('[type="submit"]');const record={id:document.getElementById('personId').value,name:document.getElementById('personName').value,email:document.getElementById('personEmail').value,department:document.getElementById('personDepartment').value,position:document.getElementById('personPosition').value,status:document.getElementById('personStatus').value,role:document.getElementById('personRole').value,views:[...document.querySelectorAll('[name="permission"]:checked')].map(input=>input.value)};submit.disabled=true;submit.textContent='GUARDANDO';try{let result;if(window.SaraBridge&&SaraBridge.isDemo()){result={ok:true,record:{...record,id:record.id||'KBS-DEMO-'+Date.now(),protected:false}}}else result=await callServer('apiSaveHierarchyRecord',record);if(!result||!result.ok)throw new Error('No se pudo guardar el acceso.');const index=(state.data.hierarchies||[]).findIndex(item=>item.id===result.record.id);if(index>=0)state.data.hierarchies[index]=result.record;else state.data.hierarchies.push(result.record);renderHierarchies();closeAccessModal();toast('Acceso actualizado y registrado en Bitacora.')}catch(error){toast(error.message,'error')}finally{submit.disabled=false;submit.textContent='GUARDAR CAMBIOS'}}
  function showAuth(message,configured=true){document.getElementById('loadingScreen').classList.add('hidden');document.getElementById('authScreen').hidden=false;document.getElementById('authMessage').textContent=message;document.getElementById('signInButton').hidden=!configured}
  async function startAuth(){const button=document.getElementById('signInButton');button.disabled=true;button.textContent='CONECTANDO';try{await SaraBridge.signIn();document.getElementById('authScreen').hidden=true;await load()}catch(error){showAuth(error.message,true)}finally{button.disabled=false;button.textContent='CONTINUAR CON GOOGLE'}}
  function renderModule(view){const meta=moduleMeta[view];document.getElementById('moduleKicker').textContent=meta.kicker;document.getElementById('moduleTitle').textContent=meta.title;document.getElementById('moduleDescription').textContent=meta.description;document.getElementById('moduleSymbol').textContent=meta.symbol;document.getElementById('moduleMessage').textContent=`${meta.title} está preparado`;document.getElementById('moduleKpis').innerHTML=meta.stats.map(([label,value])=>`<div class="module-stat"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join('')}
  function setView(view){state.currentView=view;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));let panel=document.querySelector(`[data-view-panel="${view}"]`);if(!panel){panel=document.querySelector('[data-view-panel="module"]');renderModule(view)}panel.classList.add('active');const titles={overview:'Dashboard general',alerts:'Centro de alertas',hierarchies:'Jerarquías'};document.getElementById('pageTitle').textContent=titles[view]||(moduleMeta[view]&&moduleMeta[view].title)||'SARA';document.getElementById('sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}
  function hydrate(data){state.data=data;const user=data.user;const allowed=new Set(data.permissions.views||[]);document.querySelectorAll('.nav-item[data-view]').forEach(button=>{button.hidden=!allowed.has(button.dataset.view)});document.getElementById('userName').textContent=user.name||user.email;document.getElementById('userRole').textContent=user.level===5?'SUPER ADMIN':`N${user.level} · ${user.role}`;document.getElementById('userInitials').textContent=initials(user.name||user.email);document.getElementById('lastUpdate').textContent=new Intl.DateTimeFormat('es-MX',{hour:'2-digit',minute:'2-digit'}).format(new Date(data.meta.generatedAt));document.getElementById('currentPeriod').textContent=new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric'}).format(new Date());renderKpis(data.dashboard.metrics);renderChart(data.dashboard.trend);renderAlerts(data.alerts);renderFunnel(data.dashboard.crm);renderProjects(data.dashboard.projects);if(allowed.has('hierarchies'))renderHierarchies();Hyperion.init({pulse:true});document.getElementById('loadingScreen').classList.add('hidden');document.getElementById('authScreen').hidden=true;if(data.meta.mode==='demo')toast('Vista de demostración con datos ficticios.')}

  async function load(){try{document.getElementById('loadingScreen').classList.remove('hidden');const data=await callServer('apiGetBootstrap');hydrate(data===demoData?demoData:data)}catch(error){document.getElementById('loadingScreen').classList.add('hidden');if(window.SaraBridge&&!SaraBridge.isDemo()){showAuth(error.message,true);return}toast(error.message,'error');document.getElementById('content').innerHTML=`<article class="panel module-empty"><div class="module-symbol">ERROR</div><h3>No se pudo abrir SARA</h3><p>${escapeHtml(error.message)} Contacta al superadministrador.</p></article>`}}
  function bind(){document.getElementById('navList').addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(button)setView(button.dataset.view)});document.addEventListener('click',event=>{const go=event.target.closest('[data-go]');if(go)setView(go.dataset.go);const edit=event.target.closest('[data-edit-access]');if(edit)openAccessModal(edit.dataset.editAccess);if(event.target.closest('[data-close-access]'))closeAccessModal()});document.getElementById('menuButton').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('themeButton').addEventListener('click',toggleTheme);document.getElementById('refreshButton').addEventListener('click',()=>{toast('Actualizando información.');load()});document.getElementById('newPersonButton').addEventListener('click',()=>openAccessModal());document.getElementById('signInButton').addEventListener('click',startAuth);document.getElementById('hierarchySearch').addEventListener('input',renderHierarchies);document.getElementById('alertSearch').addEventListener('input',()=>renderAlertsTable(state.data.alerts));document.getElementById('accessForm').addEventListener('submit',saveAccess);document.getElementById('personRole').addEventListener('change',event=>renderPermissionOptions(defaultViews[event.target.value]||[]));document.getElementById('accessModal').addEventListener('click',event=>{if(event.target.id==='accessModal')closeAccessModal()})}
  document.addEventListener('DOMContentLoaded',()=>{applyTheme();bind();if(window.SaraBridge&&!SaraBridge.isDemo()){if(!SaraBridge.isConfigured())showAuth('Configura el Client ID de Google y el Deployment ID de Apps Script antes de publicar.',false);else showAuth('Usa tu cuenta corporativa para consultar las secciones autorizadas.',true)}else load()});
  return{setView,load};
})();
</script>
